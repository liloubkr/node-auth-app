# Three containers that work together: database, backend API, frontend.
# Start everything:  docker compose up --build
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # read from .env (not committed)
      POSTGRES_DB: auth
    ports:
      - "5432:5432" # exercise 3: lets DBeaver/pgAdmin connect. Remove in production.
    volumes:
      - db-data:/var/lib/postgresql # named volume: data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d auth"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@db:5432/auth
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy # wait until Postgres accepts connections

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.multistage
    ports:
      - "5173:80" # host:container. Only the frontend is reachable from your machine.
    depends_on:
      - backend

volumes:
  db-data:
